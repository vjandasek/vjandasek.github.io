baseURL = 'http://localhost:1313/'
locale = 'cs-CZ'
title = 'vjandasek'
theme = 'massively-mod'
defaultContentLanguage = 'cs'
capitalizeListTitles = false
disableKinds = ['taxonomy']  # no /tags/ overview page; see [taxonomies]

[params]
  # set below parameter to define a favicon
  favicon = '/favicon.ico'
  # set to change date format
  dateFormat = '2.1.2006'
  backgroundPath = 'images/bg.jpg'
  # Default meta description and link-preview image (pages can override; see _partials/seo.html)
  description = 'Vít Jandásek, fotografie dopravy, přírody, krajiny, města; analogová fotografie a cestovatelský fotoblog.'
  ogImage = 'images/bg.jpg'
  homeTitle = 'Home'

# Below parameters can be set to override default post settings
[params.posts]
  folderName = 'post'
  pageSize = '6'
  featuredPost = 'true'
  paginationPages = 2
  showFirstLast = false

[languages]
[languages.cs]
  label = 'Čeština'
[languages.cs.params]
  homeTitle = 'Úvod'

# Only tags are used; Hugo's default 'categories' taxonomy is switched off
# Each tag has its own page (/tags/<tag>/), but there's no /tags/ overview:
# the tag cloud on /blog/ is the overview (disableKinds at the top).
[taxonomies]
  tag = 'tags'
