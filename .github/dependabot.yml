# Keep GitHub Actions and the locked Pagefind from quietly going stale.
# Dependabot opens PRs against master; the workflow doesn't build PRs, so
# test one with `gh workflow run hugo.yaml --ref <dependabot-branch>`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
